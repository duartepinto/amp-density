[project]
name = "portugal-density"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "numpy>=2.5.4",
    "osmium>=4.3.2",
    "pandas>=3.1.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
