<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porto Density Grid</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root {
      --surface: #ffffff;
      --ink: #1a1a19;
      --ink-2: #4b4b47;
      --muted: #76756f;
      --line: #e4e3df;
      --track: #f0efec;
      --houses: #e87ba4;
      --apts: #2a78d6;
      --low: #9085e9;
      --tall: #4a3aa7;
      --highlight: #1a1a19;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: #222221;
        --ink: #f2f1ee;
        --ink-2: #c9c8c3;
        --muted: #9a9993;
        --line: #3a3a37;
        --track: #383835;
        --houses: #d55181;
        --apts: #3987e5;
        --low: #5b4dbf;
        --tall: #b3aaf2;
        --highlight: #f2f1ee;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --surface: #222221;
      --ink: #f2f1ee;
      --ink-2: #c9c8c3;
      --muted: #9a9993;
      --line: #3a3a37;
      --track: #383835;
      --houses: #d55181;
      --apts: #3987e5;
      --low: #5b4dbf;
      --tall: #b3aaf2;
      --highlight: #f2f1ee;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--surface);
      color: var(--ink);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #map { position: absolute; inset: 0; }
    a { color: inherit; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .card {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgb(0 0 0 / 0.12);
      padding: 12px 14px;
    }
    #title { top: 12px; left: 12px; width: 300px; }
    #title h1 { font-size: 16px; margin: 0 0 2px; }
    #title p { margin: 0; }
    #credits { bottom: 12px; left: 12px; padding: 6px 10px; max-width: calc(100% - 24px); }

    /* Legend: one row of swatches with break labels under the seams */
    #legend { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin: 10px 0 18px; }
    #legend .sw { height: 10px; position: relative; }
    #legend .sw:first-child { border-radius: 4px 0 0 4px; }
    #legend .sw:last-child { border-radius: 0 4px 4px 0; }
    #legend .sw span {
      position: absolute; top: 13px; left: -1px; transform: translateX(-50%);
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }
    #legend .sw:first-child span { transform: none; left: 0; }

    #panel { top: 12px; right: 12px; width: 340px; max-height: calc(100% - 24px); overflow-y: auto; }
    #close {
      position: absolute; top: 6px; right: 8px; border: 0; background: none;
      font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px;
    }
    .hero { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .hero small { font-size: 13px; font-weight: 400; color: var(--muted); }
    .rows { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin-top: 12px; font-variant-numeric: tabular-nums; }
    .rows dt { color: var(--ink-2); }
    .rows dd { margin: 0; text-align: right; font-weight: 550; }
    .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
    #panel h2 { font-size: 13px; font-weight: 600; margin: 18px 0 0; color: var(--ink-2); }

    /* Two-part split bars: single-family vs apartments, 1-2 vs 3+ floors */
    .split { display: flex; gap: 2px; height: 10px; margin: 8px 0 6px; }
    .split div { border-radius: 4px; min-width: 4px; }
    .split .none { background: var(--track); flex: 1; }
    .floors { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 6px; }
    .key { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
    .key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

    /* Metro: toggle in the title card, line badges, station hover tooltip */
    #metro-toggle { display: flex; gap: 6px; align-items: baseline; margin-top: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
    #metro-toggle[hidden] { display: none; }
    #metro-toggle input { margin: 0; accent-color: var(--ink); }
    .station-name { font-size: 20px; font-weight: 650; margin: 0 24px 8px 0; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px;
      padding: 0 5px; border-radius: 10px; font-size: 12px; font-weight: 700;
    }
    /* Lines under construction: dashed outline badge, like their dashed track */
    .badge.planned { background: var(--surface); color: var(--ink); border: 2px dashed; }
    /* Train frequency table: minutes between trains per line, by period */
    .freq { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .freq th, .freq td { padding: 3px 0; text-align: right; font-weight: 400; }
    .freq thead th { color: var(--muted); font-weight: 500; }
    .freq tbody th { text-align: left; width: 48px; }
    .freq tr.all > * { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
    .trains-total { margin: 6px 0 0; color: var(--ink-2); }
    .trains-total b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .line-list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
    .line-list li { display: flex; gap: 8px; align-items: center; }
    .tip .maplibregl-popup-content {
      background: var(--surface); color: var(--ink); padding: 4px 8px; border-radius: 6px;
      font: 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 1px 6px rgb(0 0 0 / 0.2);
    }
    .tip .maplibregl-popup-tip { display: none; }

    @media (max-width: 640px) {
      #title { right: 12px; width: auto; }
      #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 55%; border-radius: 12px 12px 0 0; }
      #credits { display: none; }
      .maplibregl-ctrl-bottom-right .maplibregl-ctrl-group { display: none; } /* pinch-zoom instead */
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <header class="card" id="title">
    <h1 id="region">Population density</h1>
    <p class="muted" id="subtitle">Residents per km² · Census 2021</p>
    <div id="legend"></div>
    <p class="muted small" id="status">Loading grid…</p>
    <label id="metro-toggle" hidden><input type="checkbox" checked> <span id="metro-summary">Metro</span></label>
  </header>

  <aside class="card" id="panel" hidden>
    <button id="close" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <footer class="card small muted" id="credits">
    Census: <a href="https://censos.ine.pt">INE Censos 2021 (BGRI)</a> ·
    placed using buildings from <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>,
    <a href="https://overturemaps.org">Overture Maps</a> and
    <a href="https://human-settlement.emergency.copernicus.eu">GHSL</a> ·
    metro and walking paths from OpenStreetMap
  </footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.12.1/proj4.js"></script>
  <script>
    // Population density grid: renders the cells in data/<region>.js
    // (produced by pipeline/build_grid.py) and shows a cell's residents on click.
    // The data is a plain <script> (not fetched JSON) so the page also works from file://.

    const REGION = new URLSearchParams(location.search).get("region") || "amp";

    proj4.defs(
      "EPSG:3035",
      "+proj=laea +lat_0=52 +lon_0=10 +x_0=4321000 +y_0=3210000 +ellps=GRS80 +units=m +no_defs"
    );
    const toLonLat = proj4("EPSG:3035", "EPSG:4326");

    // Residents per km² class breaks (lower bounds). Green -> orange -> red with
    // lightness falling step by step, so the order still reads without hue.
    const BREAKS = [0, 100, 500, 1000, 2500, 5000, 10000];
    const RAMP = ["#59de65", "#9dcd0d", "#e1ab11", "#e68710", "#e25500", "#cc2a1b", "#a20519"];
    const BASEMAP = {
      light: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
      dark: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    };

    const darkQuery = matchMedia("(prefers-color-scheme: dark)");
    const theme = () => {
      const forced = document.documentElement.dataset.theme;
      return forced || (darkQuery.matches ? "dark" : "light");
    };

    let data; // { columns: { e, n, pop }, count, cell, bounds, region }
    let metro = null; // data/<region>_metro.js (pipeline/build_metro.py), when built
    let selected = null;
    let station = null; // index into metro.stations
    // isStyleLoaded() is false while tiles load, so track "style.load" ourselves.
    let styleReady = false;
    const startedWithView = Boolean(location.hash); // MapLibre writes the hash on load

    const map = new maplibregl.Map({
      container: "map",
      style: BASEMAP[theme()],
      center: [-8.6, 41.15],
      zoom: 10,
      hash: true,
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

    const fmtInt = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 0 });
    const fmt1 = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 1 });

    // Allocated census counts are fractional; show "<1" instead of a misleading zero.
    function count(v) {
      if (v <= 0) return "0";
      if (v < 0.5) return "<1";
      return fmtInt.format(v);
    }

    function pct(part, total) {
      return total > 0 ? `${Math.round((100 * part) / total)}%` : "–";
    }

    // Two-part bar plus its key. Each part: [label, value, CSS colour variable].
    function splitBar(a, b) {
      const total = a[1] + b[1];
      const seg = ([, v, colour]) => (v > 0 ? `<div style="flex:${v};background:var(${colour})"></div>` : "");
      const key = ([label, v, colour]) =>
        `<span><i style="background:var(${colour})"></i>${label} · ${count(v)} (${pct(v, total)})</span>`;
      return `<div class="split">${total > 0 ? seg(a) + seg(b) : `<div class="none"></div>`}</div>
        <div class="key">${key(a)}${key(b)}</div>`;
    }

    function compact(v) {
      return v >= 1000 ? `${fmt1.format(v / 1000)}k` : fmtInt.format(v);
    }

    const cellKm2 = () => (data.cell * data.cell) / 1e6;

    function fillColor() {
      const expr = ["step", ["get", "d"], RAMP[0]];
      for (let i = 1; i < BREAKS.length; i++) expr.push(BREAKS[i], RAMP[i]);
      return expr;
    }

    function renderLegend() {
      document.getElementById("legend").innerHTML = BREAKS.map(
        (b, i) => `<div class="sw" style="background:${RAMP[i]}"><span>${compact(b)}</span></div>`
      ).join("");
    }

    function buildGeoJSON() {
      const { e, n, pop } = data.columns;
      const size = data.cell;
      const features = new Array(data.count);
      for (let i = 0; i < data.count; i++) {
        const x0 = e[i] * size, y0 = n[i] * size, x1 = x0 + size, y1 = y0 + size;
        const ring = [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]].map((p) => toLonLat.forward(p));
        features[i] = {
          type: "Feature",
          id: i,
          properties: { d: pop[i] / cellKm2() },
          geometry: { type: "Polygon", coordinates: [ring] },
        };
      }
      return { type: "FeatureCollection", features };
    }

    function addLayers() {
      if (!data || map.getSource("cells")) return;
      map.addSource("cells", { type: "geojson", data: buildGeoJSON(), tolerance: 0 });
      // Cells go under the streets (so roads stay visible on top) but over building
      // footprints, which the basemap draws above roads and would otherwise hide the
      // colour. The selection outline sits above everything but the labels.
      const layers = map.getStyle().layers;
      const roadsStart = layers.find(isRoad)?.id;
      const labelsStart = layers[layers.findLastIndex((l) => l.type !== "symbol") + 1]?.id;
      map.addLayer(
        {
          id: "cells-fill",
          type: "fill",
          source: "cells",
          paint: {
            "fill-color": fillColor(),
            "fill-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0.85, 15, 0.6],
          },
        },
        roadsStart
      );
      map.addLayer(
        {
          id: "cells-line",
          type: "line",
          source: "cells",
          paint: {
            "line-color": theme() === "dark" ? "#f2f1ee" : "#1a1a19",
            "line-width": ["case", ["boolean", ["feature-state", "selected"], false], 2.5,
              ["boolean", ["feature-state", "hover"], false], 1.2, 0],
          },
        },
        labelsStart
      );
      for (const l of layers) {
        if (isBuilding(l)) map.moveLayer(l.id, "cells-fill");
      }
      // Buildings of the selected cell, drawn over the cells but still under the streets.
      const ink = getComputedStyle(document.documentElement).getPropertyValue("--highlight").trim();
      map.addSource("selected-buildings", { type: "geojson", data: EMPTY });
      map.addLayer(
        { id: "selected-buildings", type: "fill", source: "selected-buildings", paint: { "fill-color": ink, "fill-opacity": 0.55 } },
        roadsStart
      );
      if (selected !== null) {
        map.setFeatureState({ source: "cells", id: selected }, { selected: true });
        highlightBuildings();
      }
    }

    // CARTO names these "roads"/"buildings"; OpenMapTiles styles "transportation"/"building".
    const isRoad = (l) => ["roads", "transportation"].includes(l["source-layer"]);
    const isBuilding = (l) => ["buildings", "building"].includes(l["source-layer"]);
    const EMPTY = { type: "FeatureCollection", features: [] };
    const BUILDINGS_MINZOOM = 13; // the basemap only carries building shapes from here

    // Copies the basemap's building shapes whose centre falls inside the selected cell
    // into the highlight layer. Re-run on "idle" so it follows zooming and panning.
    function highlightBuildings() {
      const target = map.getSource("selected-buildings");
      if (!target) return;
      const layer = map.getStyle().layers.find(isBuilding);
      if (selected === null || !layer || map.getZoom() < BUILDINGS_MINZOOM) {
        target.setData(EMPTY);
        return;
      }
      const c = data.columns, size = data.cell;
      const x0 = c.e[selected] * size, y0 = c.n[selected] * size;
      const seen = new Set();
      const features = [];
      for (const f of map.querySourceFeatures(layer.source, { sourceLayer: layer["source-layer"] })) {
        const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates]
          : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
        for (const rings of polys) {
          const outer = rings[0];
          let lon = 0, lat = 0;
          for (const [x, y] of outer) { lon += x; lat += y; }
          const [x, y] = toLonLat.inverse([lon / outer.length, lat / outer.length]);
          if (x < x0 || x >= x0 + size || y < y0 || y >= y0 + size) continue;
          // Tiles overlap at their edges, so the same shape can come back twice.
          const key = outer.slice(0, 3).flat().map((v) => v.toFixed(6)).join();
          if (seen.has(key)) continue;
          seen.add(key);
          features.push({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: rings } });
        }
      }
      target.setData({ type: "FeatureCollection", features });
    }

    // Metro lines, stations and the selected station's walking area. Lines sharing
    // track are drawn side by side: each track piece carries its slot `k` across the bundle.
    // Lines under construction are dashed, and stations not yet open are grey.
    const METRO_LAYERS = ["metro-casing", "metro-lines", "metro-planned", "stations", "station-labels"];
    const PLANNED = ["boolean", ["get", "planned"], false];
    const byZoom = (z9, z13, z16) => ["interpolate", ["linear"], ["zoom"], 9, z9, 13, z13, 16, z16];
    const LINE_W = [2, 3, 5];

    function addMetroLayers() {
      if (!metro || !styleReady || map.getSource("metro")) return;
      const css = getComputedStyle(document.documentElement);
      const surface = css.getPropertyValue("--surface").trim();
      const ink = css.getPropertyValue("--ink").trim();
      const muted = css.getPropertyValue("--muted").trim();
      const layers = map.getStyle().layers;
      const labelsStart = layers[layers.findLastIndex((l) => l.type !== "symbol") + 1]?.id;
      const visibility = document.querySelector("#metro-toggle input").checked ? "visible" : "none";

      // Walking area: everything outside it is faded, and it gets an outline.
      map.addSource("walk", { type: "geojson", data: EMPTY });
      map.addLayer({ id: "walk-mask", type: "fill", source: "walk", filter: ["==", ["get", "part"], "mask"],
        paint: { "fill-color": surface, "fill-opacity": 0.65 } }, labelsStart);
      map.addLayer({ id: "walk-line", type: "line", source: "walk", filter: ["==", ["get", "part"], "area"],
        paint: { "line-color": ink, "line-width": 2 } }, labelsStart);

      map.addSource("metro", { type: "geojson", data: metro.tracks });
      const offset = byZoom(...LINE_W.map((w) => ["*", ["get", "k"], w]));
      const round = { "line-cap": "round", "line-join": "round", visibility };
      map.addLayer({ id: "metro-casing", type: "line", source: "metro", layout: round,
        paint: { "line-color": surface, "line-width": byZoom(...LINE_W.map((w) => w + 2)), "line-offset": offset } }, labelsStart);
      map.addLayer({ id: "metro-lines", type: "line", source: "metro", layout: round, filter: ["!", PLANNED],
        paint: { "line-color": ["get", "c"], "line-width": byZoom(...LINE_W), "line-offset": offset } }, labelsStart);
      map.addLayer({ id: "metro-planned", type: "line", source: "metro", layout: { ...round, "line-cap": "butt" }, filter: PLANNED,
        paint: { "line-color": ["get", "c"], "line-width": byZoom(...LINE_W), "line-dasharray": [2, 1.2] } }, labelsStart);

      map.addSource("stations", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: metro.stations.map((s, i) => ({
            type: "Feature", id: i,
            properties: { name: s.name, hub: s.lines.length + s.planned.length > 1, future: s.lines.length === 0 },
            geometry: { type: "Point", coordinates: [s.lon, s.lat] },
          })),
        },
      });
      const on = ["boolean", ["feature-state", "selected"], false];
      map.addLayer({ id: "stations", type: "circle", source: "stations", layout: { visibility },
        paint: {
          "circle-radius": byZoom(["case", ["get", "hub"], 2.2, 1.5], ["case", ["get", "hub"], 6, 4.5], ["case", ["get", "hub"], 9, 7]),
          "circle-color": ["case", on, ink, surface],
          "circle-stroke-color": ["case", ["get", "future"], muted, ink],
          "circle-stroke-width": byZoom(0.8, 1.8, 2.5),
        } }, labelsStart);
      map.addLayer({ id: "station-labels", type: "symbol", source: "stations", minzoom: 13,
        layout: {
          visibility,
          "text-field": ["get", "name"],
          "text-font": ["Montserrat Medium", "Open Sans Regular", "Noto Sans Regular"],
          "text-size": 12,
          "text-anchor": "left",
          "text-offset": [0.9, 0],
          "text-optional": true,
        },
        paint: { "text-color": ["case", ["get", "future"], muted, ink], "text-halo-color": surface, "text-halo-width": 1.5 } });
      if (station !== null) showWalk(station);
    }

    function showWalk(i) {
      map.setFeatureState({ source: "stations", id: i }, { selected: true });
      const walk = metro.stations[i].walk;
      // Mask = the world with the walking area cut out. Ring winding tells MapLibre
      // which rings are holes: the area's outer rings are reversed to become holes,
      // and its own holes are reversed to become islands of mask.
      const world = [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]];
      const rev = (ring) => ring.slice().reverse();
      const mask = [[world, ...walk.map((p) => rev(p[0]))], ...walk.flatMap((p) => p.slice(1).map((h) => [rev(h)]))];
      map.getSource("walk").setData({
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { part: "mask" }, geometry: { type: "MultiPolygon", coordinates: mask } },
          { type: "Feature", properties: { part: "area" }, geometry: { type: "MultiPolygon", coordinates: walk } },
        ],
      });
    }

    // Badge text: dark on light line colours (Line D yellow), white otherwise.
    function badge(ref) {
      // Service variants (Bx, the B express) take their line's colour.
      const line = metro.lines.find((l) => l.ref === ref) ?? metro.lines.find((l) => ref.startsWith(l.ref));
      if (line.planned) return `<span class="badge planned" style="border-color:${line.colour}">${ref}</span>`;
      const [r, g, b] = [1, 3, 5].map((k) => parseInt(line.colour.slice(k, k + 2), 16) / 255);
      const light = 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55;
      return `<span class="badge" style="background:${line.colour};color:${light ? "#1a1a19" : "#ffffff"}">${ref}</span>`;
    }

    // Minutes between trains in each direction, per line and for all lines together,
    // from the trains per hour counted in the timetable.
    function trainsBlock(s) {
      const t = metro.timetable;
      if (!t || !s.freq?.all) return "";
      const wait = (tph) => {
        if (!(tph > 0)) return "–";
        const m = 60 / tph;
        return m < 5 ? fmt1.format(m) : fmtInt.format(m);
      };
      const DAYS = { monday: "Weekdays", saturday: "Saturdays", sunday: "Sundays and holidays" };
      const head = t.periods.map((p) => `<th title="${DAYS[p.day]} ${p.hours}">${p.label}</th>`).join("");
      const refs = Object.keys(s.freq).filter((r) => r !== "all").sort();
      const row = (label, values, cls = "") => `<tr class="${cls}"><th>${label}</th>${values.map((v) => `<td>${wait(v)}</td>`).join("")}</tr>`;
      const weekday = t.periods.filter((p) => p.day === "monday").map((p) => `${p.label.toLowerCase()} ${p.hours}`).join(", ");
      const weekend = [...new Set(t.periods.filter((p) => p.day !== "monday").map((p) => p.hours))].join(", ");
      const date = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      return `
        <h2>Trains</h2>
        <p class="trains-total"><b>${fmtInt.format(s.freq.all[0])}</b> trains an hour stop here at weekday peak, both directions</p>
        <table class="freq">
          <thead><tr><th></th>${head}</tr></thead>
          <tbody>
            ${refs.map((r) => row(badge(r), s.freq[r])).join("")}
            ${refs.length > 1 ? row("All", s.freq.all.map((v) => v / 2), "all") : ""}
          </tbody>
        </table>
        <p class="note">
          Minutes between trains in each direction. Weekdays: ${weekday}; weekends ${weekend}.
          From Metro do Porto's timetable for ${date(t.from)} – ${date(t.to)}.
        </p>`;
    }

    function showStation(i) {
      const s = metro.stations[i];
      const w = metro.walk;
      const lines = [...s.lines, ...s.planned].map((ref) => {
        const line = metro.lines.find((l) => l.ref === ref);
        const [, word, ends] = line.name.match(/^Linha (\S+):\s*(.*)$/) || [, "", line.name];
        const label = line.planned
          ? `${word} line, ${ends} · <i>under construction${line.opening ? `, opening ${line.opening}` : ""}</i>`
          : ends;
        return `<li>${badge(ref)} <span>${label}</span></li>`;
      }).join("");
      const future = s.lines.length === 0;
      document.getElementById("panel-body").innerHTML = `
        <div class="station-name">${s.name}</div>
        ${future ? `<p class="note" style="margin:-4px 0 8px">Future station, not open yet.${s.approx
          ? " Location approximate: OpenStreetMap does not map it yet, so it is placed on the line by its described location."
          : ""}</p>` : ""}
        <div class="hero">${fmtInt.format(s.pop)} <small>residents within a ${w.minutes}-min walk</small></div>
        <dl class="rows">
          <dt>Walking area</dt><dd>${fmt1.format(s.km2)} km²</dd>
          <dt>Density in that area</dt><dd>${s.km2 > 0 ? fmtInt.format(s.pop / s.km2) : "–"} / km²</dd>
        </dl>
        <p class="note">
          The area reached on foot in ${w.minutes} minutes at ${fmt1.format(w.kmh)} km/h (${fmtInt.format(w.metres)} m)
          along streets, footpaths and stairs mapped in OpenStreetMap, from the station's platforms.
          Residents are the census grid's, counting the share of each cell inside the area.
        </p>
        <h2>Lines</h2>
        <ul class="line-list">${lines}</ul>
        ${trainsBlock(s)}
      `;
      document.getElementById("panel").hidden = false;
    }

    function selectStation(i) {
      if (station !== null && map.getSource("stations")) map.setFeatureState({ source: "stations", id: station }, { selected: false });
      station = i;
      if (i === null) {
        map.getSource("walk")?.setData(EMPTY);
        return;
      }
      select(null);
      showWalk(i);
      showStation(i);
      const [w, s, e, n] = metro.stations[i].walk.flat(2).reduce(
        ([w, s, e, n], [x, y]) => [Math.min(w, x), Math.min(s, y), Math.max(e, x), Math.max(n, y)],
        [Infinity, Infinity, -Infinity, -Infinity]);
      const narrow = innerWidth <= 640;
      map.fitBounds([[w, s], [e, n]], {
        padding: narrow ? { top: 130, bottom: innerHeight * 0.55 + 10, left: 20, right: 20 } : { top: 40, bottom: 40, left: 340, right: 380 },
        maxZoom: 15,
      });
    }

    function floorsBlock(c, i) {
      const n = c.apt_floors_n[i];
      if (!n) {
        return `<p class="note"><b>Average apartment building height:</b> not mapped in OpenStreetMap for this cell.</p>`;
      }
      return `<div class="floors">${fmt1.format(c.apt_floors[i])} floors</div>
        <p class="note" style="margin-top:2px">Average apartment building height, from ${n} building${n > 1 ? "s" : ""}
        with floors mapped in OpenStreetMap.</p>`;
    }

    function buildingHint() {
      return map.getZoom() < BUILDINGS_MINZOOM
        ? "Zoom in to see this cell's buildings highlighted."
        : "This cell's buildings are highlighted (map shapes from OpenStreetMap).";
    }

    function showCell(i) {
      const c = data.columns;
      const density = c.pop[i] / cellKm2();
      const [lon, lat] = toLonLat.forward([(c.e[i] + 0.5) * data.cell, (c.n[i] + 0.5) * data.cell]);
      const view = `${lat.toFixed(5)}/${lon.toFixed(5)}`;
      const err = data.errors || {};

      document.getElementById("panel-body").innerHTML = `
        <div class="hero">${fmtInt.format(density)} <small>residents / km²</small></div>
        <dl class="rows">
          <dt>Residents</dt><dd>${fmtInt.format(c.pop[i])}</dd>
          <dt>Dwellings</dt><dd>${fmtInt.format(c.dwellings[i])}</dd>
          <dt>Households</dt><dd>${fmtInt.format(c.households[i])}</dd>
          <dt>Average household size</dt><dd>${c.households[i] > 0 ? fmt1.format(c.pop[i] / c.households[i]) : "–"}</dd>
          <dt>Cell size</dt><dd>${data.cell} m × ${data.cell} m</dd>
        </dl>
        <p class="note">
          Census 2021, spread from census blocks onto the grid using building footprints.
          ${err.pop ? `Typical error per cell: counts ±${err.pop}${err.hh_size ? `, household size ±${err.hh_size}` : ""}.` : ""}
        </p>

        <h2>Residential buildings</h2>
        <dl class="rows">
          <dt>Buildings with dwellings</dt><dd>${count(c.res_bldg[i])}</dd>
        </dl>
        ${splitBar(["Single-family", c.houses[i], "--houses"], ["Apartments", c.apt_bldg[i], "--apts"])}
        <p class="note">
          Single-family = built for 1–2 dwellings; apartment building = built for 3 or more (INE).
          ${err.res_bldg ? `Typical error: count ±${err.res_bldg}, apartment share ±${err.apt_share}.` : ""}
        </p>

        <h2>Floors</h2>
        ${splitBar(["1–2 floors", c.low_rise[i], "--low"], ["3 or more", c.mid_rise[i], "--tall"])}
        <p class="note">Residential buildings by number of floors (INE).${err.rise_share ? ` Typical error on the share: ±${err.rise_share}.` : ""}</p>
        ${floorsBlock(c, i)}
        <p class="note" id="building-hint">${buildingHint()}</p>
        <p class="note">
          Cell ${c.e[i]}E ${c.n[i]}N (EPSG:3035) ·
          <a href="https://www.openstreetmap.org/?mlat=${lat.toFixed(5)}&mlon=${lon.toFixed(5)}#map=15/${view}" target="_blank" rel="noopener">OSM</a> ·
          <a href="https://www.google.com/maps/@${lat.toFixed(5)},${lon.toFixed(5)},700m/data=!3m1!1e3" target="_blank" rel="noopener">Satellite</a>
        </p>
      `;
      document.getElementById("panel").hidden = false;
    }

    function select(i) {
      if (selected !== null) map.setFeatureState({ source: "cells", id: selected }, { selected: false });
      selected = i;
      if (i === null) {
        document.getElementById("panel").hidden = true;
        highlightBuildings();
        return;
      }
      selectStation(null);
      map.setFeatureState({ source: "cells", id: i }, { selected: true });
      showCell(i);
      highlightBuildings();
    }

    let hovered = null;
    map.on("mousemove", "cells-fill", (ev) => {
      const id = ev.features[0].id;
      if (hovered === id) return;
      if (hovered !== null) map.setFeatureState({ source: "cells", id: hovered }, { hover: false });
      hovered = id;
      map.setFeatureState({ source: "cells", id }, { hover: true });
      map.getCanvas().style.cursor = "pointer";
    });
    map.on("mouseleave", "cells-fill", () => {
      if (hovered !== null) map.setFeatureState({ source: "cells", id: hovered }, { hover: false });
      hovered = null;
      map.getCanvas().style.cursor = "";
    });
    // Stations get a hit area wider than their dot, and win over the cell underneath.
    const near = (p, r) => [[p.x - r, p.y - r], [p.x + r, p.y + r]];
    const stationAt = (p) => map.getLayer("stations") && map.queryRenderedFeatures(near(p, 8), { layers: ["stations"] })[0];
    const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12, className: "tip" });
    let tipFor = null;
    map.on("mousemove", (ev) => {
      const hit = stationAt(ev.point);
      if (!hit) {
        if (tipFor !== null) {
          tip.remove();
          map.getCanvas().style.cursor = hovered !== null ? "pointer" : "";
        }
        tipFor = null;
        return;
      }
      map.getCanvas().style.cursor = "pointer";
      if (tipFor === hit.id) return;
      tipFor = hit.id;
      const s = metro.stations[hit.id];
      const soon = s.planned.length ? `${s.lines.length ? " + " : ""}${s.planned.join(" ")} under construction` : "";
      tip.setLngLat([s.lon, s.lat]).setHTML(`<b>${s.name}</b> · ${s.lines.join(" ")}${soon}`).addTo(map);
    });
    map.on("click", (ev) => {
      const st = stationAt(ev.point);
      if (st) return selectStation(st.id);
      const hit = map.queryRenderedFeatures(ev.point, { layers: ["cells-fill"] })[0];
      if (hit) return select(hit.id);
      select(null);
      selectStation(null);
    });
    const clearAll = () => { select(null); selectStation(null); };
    document.getElementById("close").addEventListener("click", clearAll);
    document.addEventListener("keydown", (ev) => ev.key === "Escape" && clearAll());
    document.querySelector("#metro-toggle input").addEventListener("change", (ev) => {
      for (const id of METRO_LAYERS) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", ev.target.checked ? "visible" : "none");
      if (!ev.target.checked && station !== null) clearAll();
    });

    // Switching theme swaps the basemap style, which drops our layers: re-add them.
    darkQuery.addEventListener("change", () => {
      styleReady = false;
      map.setStyle(BASEMAP[theme()], { diff: false }); // diffing would skip "style.load"
    });
    // Updating the highlight re-renders and fires "idle" again, so only redo it when
    // the selection or the view actually changed.
    let highlightedView = "";
    map.on("idle", () => {
      if (selected === null) return;
      const view = `${selected}|${map.getZoom().toFixed(2)}|${map.getCenter().toArray()}`;
      if (view === highlightedView) return;
      highlightedView = view;
      highlightBuildings();
      const hint = document.getElementById("building-hint");
      if (hint) hint.textContent = buildingHint();
    });
    map.on("style.load", () => {
      styleReady = true;
      highlightedView = ""; // a new basemap means new building tiles: redo the highlight
      addLayers();
      addMetroLayers();
    });

    function loadScript(src, global) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => (window[global] ? resolve(window[global]) : reject(new Error("empty data file")));
        script.onerror = () => reject(new Error("file not found"));
        document.head.appendChild(script);
      });
    }
    const loadData = () => loadScript(`data/${REGION}.js`, "GRID_DATA");

    // The metro layer is optional: regions without data/<region>_metro.js just skip it.
    loadScript(`data/${REGION}_metro.js`, "METRO_DATA")
      .then((json) => {
        metro = json;
        const pct = (v) => Math.round((100 * v) / metro.total_pop);
        const open = metro.stations.filter((s) => s.lines.length).length;
        const building = metro.lines.filter((l) => l.planned).map((l) => l.name.match(/^Linha ([^\s:]+)/)?.[1] ?? l.ref);
        document.getElementById("metro-summary").textContent =
          `${metro.network}: ${open} stations · ${pct(metro.covered_pop)}% of residents live within a ${metro.walk.minutes}-min walk` +
          (building.length ? `; ${pct(metro.covered_pop_planned)}% once the ${building.join(" and ")} lines (dashed) open` : "");
        document.getElementById("metro-toggle").hidden = false;
        addMetroLayers();
      })
      .catch(() => {});

    renderLegend();
    loadData()
      .then((json) => {
        data = json;
        document.getElementById("region").textContent = data.region;
        document.getElementById("subtitle").textContent =
          `Residents per km² · ${data.cell} m × ${data.cell} m cells · Census 2021`;
        const total = data.columns.pop.reduce((a, b) => a + b, 0);
        document.getElementById("status").textContent =
          `${fmtInt.format(total)} residents in ${fmtInt.format(data.count)} cells · click a cell for details`;
        if (!startedWithView) map.fitBounds([data.bounds.slice(0, 2), data.bounds.slice(2)], { padding: 20, duration: 0 });
        if (styleReady) addLayers();
      })
      .catch((err) => {
        document.getElementById("status").textContent = `Could not load data/${REGION}.js (${err.message}). Run the pipeline first.`;
      });
  </script>
</body>
</html>
