<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porto Density Grid</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MW8LDDHQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <style>
    :root {
      --surface: #ffffff;
      --ink: #1a1a19;
      --ink-2: #4b4b47;
      --muted: #76756f;
      --line: #e4e3df;
      --track: #f0efec;
      --houses: #e87ba4;
      --apts: #2a78d6;
      --low: #9085e9;
      --tall: #4a3aa7;
      --highlight: #1a1a19;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: #222221;
        --ink: #f2f1ee;
        --ink-2: #c9c8c3;
        --muted: #9a9993;
        --line: #3a3a37;
        --track: #383835;
        --houses: #d55181;
        --apts: #3987e5;
        --low: #5b4dbf;
        --tall: #b3aaf2;
        --highlight: #f2f1ee;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --surface: #222221;
      --ink: #f2f1ee;
      --ink-2: #c9c8c3;
      --muted: #9a9993;
      --line: #3a3a37;
      --track: #383835;
      --houses: #d55181;
      --apts: #3987e5;
      --low: #5b4dbf;
      --tall: #b3aaf2;
      --highlight: #f2f1ee;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--surface);
      color: var(--ink);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #map { position: absolute; inset: 0; }
    a { color: inherit; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .card {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgb(0 0 0 / 0.12);
      padding: 12px 14px;
    }
    #title { top: 12px; left: 12px; width: 300px; }
    #title h1 { font-size: 16px; margin: 0 0 2px; }
    #title p { margin: 0; }
    #fold { display: none; }
    #fold, #grip { -webkit-tap-highlight-color: transparent; }
    #credits { bottom: 12px; left: 12px; padding: 6px 10px; max-width: calc(100% - 24px); }

    /* Legend: one row of swatches with break labels under the seams */
    #legend { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin: 10px 0 18px; }
    #legend .sw { height: 10px; position: relative; }
    #legend .sw:first-child { border-radius: 4px 0 0 4px; }
    #legend .sw:last-child { border-radius: 0 4px 4px 0; }
    #legend .sw span {
      position: absolute; top: 13px; left: -1px; transform: translateX(-50%);
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }
    #legend .sw:first-child span { transform: none; left: 0; }

    /* The panel body scrolls, so the close button (and on phones the grip) stay put. */
    #panel { top: 12px; right: 12px; width: 340px; max-height: calc(100% - 24px); display: flex; flex-direction: column; }
    #panel[hidden] { display: none; }
    #panel-body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
    #grip { display: none; }
    #close {
      position: absolute; top: 6px; right: 8px; border: 0; background: none;
      font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px;
    }
    .hero { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .hero small { font-size: 13px; font-weight: 400; color: var(--muted); }
    .rows { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin-top: 12px; font-variant-numeric: tabular-nums; }
    .rows dt { color: var(--ink-2); }
    .rows dd { margin: 0; text-align: right; font-weight: 550; }
    .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
    #panel h2 { font-size: 13px; font-weight: 600; margin: 18px 0 0; color: var(--ink-2); }

    /* Two-part split bars: single-family vs apartments, 1-2 vs 3+ floors */
    .split { display: flex; gap: 2px; height: 10px; margin: 8px 0 6px; }
    .split div { border-radius: 4px; min-width: 4px; }
    .split .none { background: var(--track); flex: 1; }
    .floors { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 6px; }
    .key { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
    .key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

    /* Rail networks: one toggle each in the title card, line badges, station hover tooltip */
    #transit-toggles label { display: flex; gap: 6px; align-items: baseline; margin-top: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
    #transit-toggles input { margin: 0; accent-color: var(--ink); }
    #transit-toggles .swatch { flex: none; width: 22px; height: 6px; border-radius: 3px; align-self: center; }
    #transit-toggles .swatch.colours { background: linear-gradient(90deg, #3CAEEF 0 33%, #E62621 33% 66%, #8BC63E 66%); }
    #transit-toggles .swatch.rail { background: repeating-linear-gradient(90deg, var(--surface) 0 3px, var(--ink) 3px 7px); border: 1.5px solid var(--ink); }
    #transit-toggles p { margin: 6px 0 0 19px; font-size: 12px; color: var(--muted); }
    /* Donation link, in the yellow of Buy Me a Coffee */
    .coffee-button {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 12px;
      border-radius: 999px; background: #FFDD00; color: #000; text-decoration: none;
      font-size: 12px; font-weight: 600; box-shadow: 0 1px 4px rgb(0 0 0 / 0.15);
      transition: background 0.2s, transform 0.2s;
    }
    .coffee-button:hover { background: #FFE135; transform: translateY(-1px); }
    /* Card foot: the donation link and the language switch */
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .card-foot .coffee-button { margin-top: 0; }
    #lang { display: flex; gap: 2px; font-size: 12px; }
    #lang button {
      border: 1px solid var(--line); background: none; color: var(--muted); padding: 3px 7px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    #lang button:first-child { border-radius: 6px 0 0 6px; }
    #lang button:last-child { border-radius: 0 6px 6px 0; }
    #lang button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
    .station-name { font-size: 20px; font-weight: 650; margin: 0 24px 8px 0; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px;
      padding: 0 5px; border-radius: 10px; font-size: 12px; font-weight: 700;
    }
    /* Lines under construction: dashed outline badge, like their dashed track */
    .badge.planned { background: var(--surface); color: var(--ink); border: 2px dashed; }
    /* Train frequency table: minutes between trains per line, by period */
    .freq { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .freq th, .freq td { padding: 3px 0; text-align: right; font-weight: 400; }
    .freq thead th { color: var(--muted); font-weight: 500; }
    .freq tbody th { text-align: left; width: 48px; }
    .freq tr.all > * { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
    .trains-total { margin: 6px 0 0; color: var(--ink-2); }
    .trains-total b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .line-list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
    .line-list li { display: flex; gap: 8px; align-items: center; }
    .tip .maplibregl-popup-content {
      background: var(--surface); color: var(--ink); padding: 4px 8px; border-radius: 6px;
      font: 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 1px 6px rgb(0 0 0 / 0.2);
    }
    .tip .maplibregl-popup-tip { display: none; }

    @media (max-width: 640px) {
      #title { top: 8px; left: 8px; right: 8px; width: auto; padding: 8px 12px; }
      /* The title card folds to its name and legend: on request, and while something is selected. */
      #title h1 { margin-right: 32px; }
      #fold {
        display: block; position: absolute; top: 0; right: 0; width: 44px; height: 40px;
        border: 0; padding: 0; background: none; color: var(--muted); cursor: pointer;
      }
      #fold::before {
        content: ""; display: block; width: 8px; height: 8px; margin: 0 auto;
        border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-2px) rotate(225deg);
      }
      #title.folded #fold::before { transform: translateY(-4px) rotate(45deg); }
      #title.folded #subtitle, #title.folded #status, #title.folded #transit-toggles, #title.folded .card-foot { display: none; }
      #title.folded #legend { margin-bottom: 14px; }
      /* Bottom sheet: a short peek at the top of the details, tap or swipe up for the rest. */
      #panel {
        top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 80%;
        border-radius: 12px 12px 0 0; padding-top: 20px;
        z-index: 3; /* over the map's attribution */
      }
      #panel:not(.expanded) { max-height: 160px; cursor: pointer; }
      #panel:not(.expanded) #panel-body { overflow: hidden; }
      #panel:not(.expanded)::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32px;
        background: linear-gradient(transparent, var(--surface)); pointer-events: none;
      }
      #grip {
        display: block; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 96px; height: 20px; border: 0; padding: 0; background: none; cursor: pointer;
      }
      #grip::before { content: ""; display: block; width: 36px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--muted); opacity: 0.5; }
      #credits { display: none; }
      .maplibregl-ctrl-bottom-right .maplibregl-ctrl-group { display: none; } /* pinch-zoom instead */
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <header class="card" id="title">
    <button id="fold" aria-label="Show less" aria-expanded="true" aria-controls="title"></button>
    <h1 id="region">Population density</h1>
    <p class="muted" id="subtitle">Residents per km² · Census 2021</p>
    <div id="legend"></div>
    <p class="muted small" id="status">Loading grid…</p>
    <div id="transit-toggles"></div>
    <div class="card-foot">
      <a href="https://coff.ee/duartepinto" target="_blank" rel="noopener" class="coffee-button"><span aria-hidden="true">☕</span> <span id="coffee-text">Buy me a coffee</span></a>
      <div id="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="pt" lang="pt-PT">PT</button>
      </div>
    </div>
  </header>

  <aside class="card" id="panel" hidden>
    <button id="grip" aria-label="Show more details" aria-expanded="false"></button>
    <button id="close" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <footer class="card small muted" id="credits">
    Census: <a href="https://censos.ine.pt">INE Censos 2021 (BGRI)</a> ·
    placed using buildings from <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>,
    <a href="https://overturemaps.org">Overture Maps</a> and
    <a href="https://human-settlement.emergency.copernicus.eu">GHSL</a> ·
    rail lines and walking paths from OpenStreetMap ·
    metro timetable from <a href="https://www.metrodoporto.pt/pages/337">Metro do Porto</a>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.12.1/proj4.js"></script>
  <script>
    // Population density grid: renders the cells in data/<region>.js
    // (produced by pipeline/build_grid.py) and shows a cell's residents on click.
    // The data is a plain <script> (not fetched JSON) so the page also works from file://.

    const REGION = new URLSearchParams(location.search).get("region") || "amp";

    proj4.defs(
      "EPSG:3035",
      "+proj=laea +lat_0=52 +lon_0=10 +x_0=4321000 +y_0=3210000 +ellps=GRS80 +units=m +no_defs"
    );
    const toLonLat = proj4("EPSG:3035", "EPSG:4326");

    // Residents per km² class breaks (lower bounds). Green -> orange -> red with
    // lightness falling step by step, so the order still reads without hue.
    const BREAKS = [0, 100, 500, 1000, 2500, 5000, 10000, 15000];
    const RAMP = ["#59de65", "#9dcd0d", "#e1ab11", "#e68710", "#e25500", "#cc2a1b", "#a20519", "#7a0213"];
    const BASEMAP = {
      light: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
      dark: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    };

    const darkQuery = matchMedia("(prefers-color-scheme: dark)");
    const narrowQuery = matchMedia("(max-width: 640px)"); // phones: title on top, details in a bottom sheet
    const theme = () => {
      const forced = document.documentElement.dataset.theme;
      return forced || (darkQuery.matches ? "dark" : "light");
    };

    let data; // { columns: { e, n, pop }, count, cell, bounds, region }
    let transit = null; // data/<region>_transit.js (pipeline/build_transit.py), when built
    let drives = null; // data/<region>_drive.js: {station name: driving area}, loaded after the rest
    let selected = null;
    let station = null; // index into transit.stations
    // isStyleLoaded() is false while tiles load, so track "style.load" ourselves.
    let styleReady = false;
    const startedWithView = Boolean(location.hash); // MapLibre writes the hash on load

    const map = new maplibregl.Map({
      container: "map",
      style: BASEMAP[theme()],
      center: [-8.6, 41.15],
      zoom: 10,
      hash: true,
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

    // Interface text in English and European Portuguese. The language comes from ?lang=,
    // else the viewer's last choice, else the first of the browser's languages we have.
    const I18N = {
      en: {
        locale: "en-GB",
        dateMonth: "short",
        title: "Porto Density Grid",
        heading: "Population density",
        subtitleShort: "Residents per km² · Census 2021",
        subtitle: (cell) => `Residents per km² · ${cell} m × ${cell} m cells · Census 2021`,
        loading: "Loading grid…",
        status: (total, cells) => `${total} residents in ${cells} cells · click a cell for details`,
        loadError: (file, msg) => `Could not load ${file} (${msg}). Run the pipeline first.`,
        showMoreDetails: "Show more details",
        close: "Close",
        showMore: "Show more",
        showLess: "Show less",
        language: "Language",
        coffee: "Buy me a coffee",
        credits: `Census: <a href="https://censos.ine.pt">INE Censos 2021 (BGRI)</a> ·
          placed using buildings from <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>,
          <a href="https://overturemaps.org">Overture Maps</a> and
          <a href="https://human-settlement.emergency.copernicus.eu">GHSL</a> ·
          rail lines, walking paths and roads from OpenStreetMap ·
          metro timetable from <a href="https://www.metrodoporto.pt/pages/337">Metro do Porto</a>`,
        // Cell panel
        perKm2: "residents / km²",
        residents: "Residents",
        dwellings: "Dwellings",
        households: "Households",
        hhSize: "Average household size",
        cellSize: "Cell size",
        cellNote: "Census 2021, spread from census blocks onto the grid using building footprints.",
        cellError: (pop, hh) => `Typical error per cell: counts ±${pop}${hh ? `, household size ±${hh}` : ""}.`,
        resBuildings: "Residential buildings",
        withDwellings: "Buildings with dwellings",
        singleFamily: "Single-family",
        apartments: "Apartments",
        typeNote: "Single-family = built for 1–2 dwellings; apartment building = built for 3 or more (INE).",
        typeError: (count, share) => `Typical error: count ±${count}, apartment share ±${share}.`,
        floors: "Floors",
        lowRise: "1–2 floors",
        midRise: "3 or more",
        floorsNote: "Residential buildings by number of floors (INE).",
        floorsError: (e) => ` Typical error on the share: ±${e}.`,
        floorsNone: "<b>Average apartment building height:</b> not mapped in OpenStreetMap for this cell.",
        floorsValue: (v) => `${v} floors`,
        floorsFrom: (n) => `Average apartment building height, from ${n} building${n > 1 ? "s" : ""} with floors mapped in OpenStreetMap.`,
        zoomHint: "Zoom in to see this cell's buildings highlighted.",
        highlighted: "This cell's buildings are highlighted (map shapes from OpenStreetMap).",
        cell: "Cell",
        satellite: "Satellite",
        points: "pts",
        // Station panel
        future: "Future station, not open yet.",
        approx: " Location approximate: OpenStreetMap does not map it yet, so it is placed on the line by its described location.",
        walkHero: (m) => `residents within a ${m}-min walk`,
        walkArea: "Walking area",
        densityThere: "Density in that area",
        walkNote: (m, kmh, metres) => `The area reached on foot in ${m} minutes at ${kmh} km/h (${metres} m) along streets,
          footpaths and stairs mapped in OpenStreetMap, from the station's platforms. Residents are the census grid's,
          counting the share of each cell inside the area.`,
        byCar: "By car",
        driveHero: (m) => `residents within a ${m}-min drive`,
        driveArea: "Driving area",
        driveNote: (m, share, signal, junction, reach) => `Where one can drive to the station from in ${m} minutes
          (dashed outline), along roads mapped in OpenStreetMap at free-flow speeds: typical speeds by road type, or
          ${share}% of the speed limit where mapped, one-way streets respected, losing ${signal} s at each traffic light
          and ${junction} s at other junctions. Congestion and parking are not counted, so at rush hour the real area is
          smaller. Homes within ${reach} m of a reached road count.`,
        planned: (line, opening) => {
          const word = line.name.match(/^Linha (\S+)$/)?.[1];
          return `${word ? `${word} line, ` : ""}${line.ends} · <i>under construction${opening ? `, opening ${opening}` : ""}</i>`;
        },
        underConstruction: "under construction",
        nets: { Metro: "Metro", Trains: "Trains" },
        frequency: "Frequency",
        noTimetable: (names) => `No timetable for ${names} yet.`,
        trainsTotal: (n, net, several) => `<b>${n}</b> ${several ? `${net.label.toLowerCase()} trains` : "trains"}
          an hour stop here at weekday peak, both directions`,
        all: "All",
        periods: { Peak: "Peak", Midday: "Midday", Evening: "Evening", Sat: "Sat", Sun: "Sun" },
        hours: (h) => h,
        days: { monday: "Weekdays", saturday: "Saturdays", sunday: "Sundays and holidays" },
        freqNote: (weekday, weekend, network, from, to) => `Minutes between trains in each direction. Weekdays: ${weekday};
          weekends ${weekend}. From ${network}'s timetable for ${from} – ${to}.`,
        // Title card
        toggle: (names, stations, walkPct, m) => `${names}: ${stations} stations · ${walkPct}% of residents live within a ${m}-min walk`,
        togglePlanned: (p, lines) => `; ${p}% once the ${lines.join(" and ")} lines (dashed) open`,
        toggleDrive: (p, m) => `; ${p}% within a ${m}-min drive`,
        anyStation: (p, m) => `${p}% live within a ${m}-min walk of any station.`,
        plannedName: (line) => line.name.match(/^Linha (\S+)$/)?.[1] ?? line.label,
      },
      pt: {
        locale: "pt-PT",
        dateMonth: "long", // "7 de setembro de 2026"; short months come out as 7/09/2026
        title: "Densidade populacional do Porto",
        heading: "Densidade populacional",
        subtitleShort: "Residentes por km² · Censos 2021",
        subtitle: (cell) => `Residentes por km² · células de ${cell} m × ${cell} m · Censos 2021`,
        loading: "A carregar a grelha…",
        status: (total, cells) => `${total} residentes em ${cells} células · clique numa célula para ver os detalhes`,
        loadError: (file, msg) => `Não foi possível carregar ${file} (${msg}). Corra primeiro os scripts em pipeline/.`,
        showMoreDetails: "Mostrar mais detalhes",
        close: "Fechar",
        showMore: "Mostrar mais",
        showLess: "Mostrar menos",
        language: "Idioma",
        coffee: "Ofereça-me um café",
        credits: `Dados dos Censos 2021: <a href="https://censos.ine.pt">INE (BGRI)</a> ·
          distribuídos segundo os edifícios do <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>,
          da <a href="https://overturemaps.org">Overture Maps</a> e do
          <a href="https://human-settlement.emergency.copernicus.eu">GHSL</a> ·
          linhas de metro e comboio, caminhos e estradas do OpenStreetMap ·
          horários do <a href="https://www.metrodoporto.pt/pages/337">Metro do Porto</a>`,
        perKm2: "residentes / km²",
        residents: "Residentes",
        dwellings: "Alojamentos",
        households: "Agregados domésticos",
        hhSize: "Dimensão média do agregado",
        cellSize: "Tamanho da célula",
        cellNote: "Dados dos Censos 2021, repartidos pela grelha a partir das subsecções estatísticas, com base na área de implantação dos edifícios.",
        cellError: (pop, hh) => `Erro típico por célula: contagens ±${pop}${hh ? `, dimensão do agregado ±${hh}` : ""}.`,
        resBuildings: "Edifícios residenciais",
        withDwellings: "Edifícios com alojamentos",
        singleFamily: "Moradias",
        apartments: "Prédios",
        typeNote: "Moradia = construída para 1 ou 2 alojamentos; prédio = construído para 3 ou mais (INE).",
        typeError: (count, share) => `Erro típico: contagem ±${count}, proporção de prédios ±${share}.`,
        floors: "Pisos",
        lowRise: "1 ou 2 pisos",
        midRise: "3 ou mais",
        floorsNote: "Edifícios residenciais por número de pisos (INE).",
        floorsError: (e) => ` Erro típico na proporção: ±${e}.`,
        floorsNone: "<b>Altura média dos prédios:</b> o número de pisos não está mapeado no OpenStreetMap nesta célula.",
        floorsValue: (v) => `${v} pisos`,
        floorsFrom: (n) => `Altura média dos prédios, a partir de ${n} edifício${n > 1 ? "s" : ""} com o número de pisos mapeado no OpenStreetMap.`,
        zoomHint: "Amplie o mapa para ver os edifícios desta célula em destaque.",
        highlighted: "Os edifícios desta célula estão em destaque (contornos do OpenStreetMap).",
        cell: "Célula",
        satellite: "Satélite",
        points: "pontos percentuais",
        future: "Futura estação, ainda sem serviço.",
        approx: " Posição aproximada: como ainda não consta do OpenStreetMap, foi colocada na linha de acordo com a localização anunciada.",
        walkHero: (m) => `residentes a ${m} min a pé`,
        walkArea: "Área abrangida",
        densityThere: "Densidade nessa área",
        walkNote: (m, kmh, metres) => `Área que se alcança a pé em ${m} minutos, a ${kmh} km/h (${metres} m), por ruas,
          caminhos e escadas mapeados no OpenStreetMap, a partir das plataformas da estação. Os residentes vêm da grelha
          dos censos: de cada célula conta a parte que fica dentro da área.`,
        byCar: "De carro",
        driveHero: (m) => `residentes a ${m} min de carro`,
        driveArea: "Área abrangida",
        driveNote: (m, share, signal, junction, reach) => `Zona a partir da qual se chega de carro à estação em ${m} minutos
          (contorno a tracejado), pelas vias mapeadas no OpenStreetMap: velocidades típicas de cada tipo de via, ou ${share}%
          do limite de velocidade quando está mapeado, respeitando os sentidos únicos, com ${signal} s de espera em cada
          semáforo e ${junction} s nos restantes cruzamentos. Não se conta com o trânsito nem com o tempo para estacionar,
          por isso, à hora de ponta, a área real é menor. Contam-se as casas a menos de ${reach} m de uma via alcançada.`,
        planned: (line, opening) =>
          `${/^Linha \S+$/.test(line.name) ? `${line.name}, ` : ""}${line.ends} · <i>em construção${opening ? `, abertura prevista para ${opening}` : ""}</i>`,
        underConstruction: "em construção",
        nets: { Metro: "Metro", Trains: "Comboios" },
        frequency: "Frequência",
        noTimetable: (names) => `Ainda não há horários disponíveis (${names}).`,
        trainsTotal: (n, net) => `<b>${n}</b> passage${n === "1" ? "m" : "ns"} de ${net.key === "metro" ? "metro" : "comboio"}
          por hora nesta estação à hora de ponta dos dias úteis, nos dois sentidos`,
        all: "Todas",
        periods: { Peak: "Ponta", Midday: "Meio do dia", Evening: "Noite", Sat: "Sáb", Sun: "Dom" },
        hours: (h) => h.replace(/(\d+):(\d\d)/g, (_, hh, mm) => (mm === "00" ? `${hh}h` : `${hh}h${mm}`)),
        days: { monday: "Dias úteis", saturday: "Sábados", sunday: "Domingos e feriados" },
        freqNote: (weekday, weekend, network, from, to) => `Minutos entre passagens em cada sentido. Dias úteis: ${weekday};
          fins de semana ${weekend}. Fonte: ${network}, horários válidos de ${from} a ${to}.`,
        toggle: (names, stations, walkPct, m) => `${names}: ${stations} estações · ${walkPct}% dos residentes vivem a ${m} min a pé`,
        togglePlanned: (p, lines) => `; ${p}% quando abrirem as linhas ${lines.join(" e ")} (a tracejado)`,
        toggleDrive: (p, m) => `; ${p}% a ${m} min de carro`,
        anyStation: (p, m) => `${p}% vivem a ${m} min a pé de pelo menos uma estação.`,
        plannedName: (line) => line.name.match(/^Linha (\S+)$/)?.[1] ?? line.label,
      },
    };
    const LANGS = Object.keys(I18N);
    function pickLang() {
      const asked = new URLSearchParams(location.search).get("lang");
      let saved = null;
      try { saved = localStorage.getItem("lang"); } catch {}
      const browser = (navigator.languages ?? [navigator.language]).map((l) => l.slice(0, 2).toLowerCase())
        .find((l) => LANGS.includes(l));
      return [asked, saved, browser].find((l) => LANGS.includes(l)) ?? "en";
    }
    let lang = pickLang();
    const t = (key, ...args) => {
      const v = I18N[lang][key] ?? I18N.en[key];
      return typeof v === "function" ? v(...args) : v;
    };
    let fmtInt, fmt1;
    function setFormats() {
      fmtInt = new Intl.NumberFormat(t("locale"), { maximumFractionDigits: 0 });
      fmt1 = new Intl.NumberFormat(t("locale"), { maximumFractionDigits: 1 });
    }
    setFormats();
    // Error figures come from the data as "14%" or "4 pts".
    const errText = (e) => String(e).replace("pts", t("points"));
    const netLabel = (n) => t("nets")[n.label] ?? n.label;

    // Allocated census counts are fractional; show "<1" instead of a misleading zero.
    function count(v) {
      if (v <= 0) return "0";
      if (v < 0.5) return "<1";
      return fmtInt.format(v);
    }

    function pct(part, total) {
      return total > 0 ? `${Math.round((100 * part) / total)}%` : "–";
    }

    // Two-part bar plus its key. Each part: [label, value, CSS colour variable].
    function splitBar(a, b) {
      const total = a[1] + b[1];
      const seg = ([, v, colour]) => (v > 0 ? `<div style="flex:${v};background:var(${colour})"></div>` : "");
      const key = ([label, v, colour]) =>
        `<span><i style="background:var(${colour})"></i>${label} · ${count(v)} (${pct(v, total)})</span>`;
      return `<div class="split">${total > 0 ? seg(a) + seg(b) : `<div class="none"></div>`}</div>
        <div class="key">${key(a)}${key(b)}</div>`;
    }

    function compact(v) {
      return v >= 1000 ? `${fmt1.format(v / 1000)}k` : fmtInt.format(v);
    }

    const cellKm2 = () => (data.cell * data.cell) / 1e6;

    function fillColor() {
      const expr = ["step", ["get", "d"], RAMP[0]];
      for (let i = 1; i < BREAKS.length; i++) expr.push(BREAKS[i], RAMP[i]);
      return expr;
    }

    function renderLegend() {
      document.getElementById("legend").innerHTML = BREAKS.map(
        (b, i) => `<div class="sw" style="background:${RAMP[i]}"><span>${compact(b)}</span></div>`
      ).join("");
    }

    function buildGeoJSON() {
      const { e, n, pop } = data.columns;
      const size = data.cell;
      const features = new Array(data.count);
      for (let i = 0; i < data.count; i++) {
        const x0 = e[i] * size, y0 = n[i] * size, x1 = x0 + size, y1 = y0 + size;
        const ring = [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]].map((p) => toLonLat.forward(p));
        features[i] = {
          type: "Feature",
          id: i,
          properties: { d: pop[i] / cellKm2() },
          geometry: { type: "Polygon", coordinates: [ring] },
        };
      }
      return { type: "FeatureCollection", features };
    }

    function addLayers() {
      if (!data || map.getSource("cells")) return;
      map.addSource("cells", { type: "geojson", data: buildGeoJSON(), tolerance: 0 });
      // Cells go under the streets (so roads stay visible on top) but over building
      // footprints, which the basemap draws above roads and would otherwise hide the
      // colour. The selection outline sits above everything but the labels.
      const layers = map.getStyle().layers;
      const roadsStart = layers.find(isRoad)?.id;
      const labelsStart = layers[layers.findLastIndex((l) => l.type !== "symbol") + 1]?.id;
      map.addLayer(
        {
          id: "cells-fill",
          type: "fill",
          source: "cells",
          paint: {
            "fill-color": fillColor(),
            "fill-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0.85, 15, 0.6],
          },
        },
        roadsStart
      );
      map.addLayer(
        {
          id: "cells-line",
          type: "line",
          source: "cells",
          paint: {
            "line-color": theme() === "dark" ? "#f2f1ee" : "#1a1a19",
            "line-width": ["case", ["boolean", ["feature-state", "selected"], false], 2.5,
              ["boolean", ["feature-state", "hover"], false], 1.2, 0],
          },
        },
        labelsStart
      );
      for (const l of layers) {
        if (isBuilding(l)) map.moveLayer(l.id, "cells-fill");
      }
      // Buildings of the selected cell, drawn over the cells but still under the streets.
      const ink = getComputedStyle(document.documentElement).getPropertyValue("--highlight").trim();
      map.addSource("selected-buildings", { type: "geojson", data: EMPTY });
      map.addLayer(
        { id: "selected-buildings", type: "fill", source: "selected-buildings", paint: { "fill-color": ink, "fill-opacity": 0.55 } },
        roadsStart
      );
      if (selected !== null) {
        map.setFeatureState({ source: "cells", id: selected }, { selected: true });
        highlightBuildings();
      }
    }

    // CARTO names these "roads"/"buildings"; OpenMapTiles styles "transportation"/"building".
    const isRoad = (l) => ["roads", "transportation"].includes(l["source-layer"]);
    const isBuilding = (l) => ["buildings", "building"].includes(l["source-layer"]);
    const EMPTY = { type: "FeatureCollection", features: [] };
    // Fade outside a selected station's walking area; with a driving area, two lighter
    // fades that stack to about the same beyond it (1 - 0.6² ≈ 0.65).
    const WALK_FADE = 0.65, DRIVE_FADE = 0.4;
    const BUILDINGS_MINZOOM = 13; // the basemap only carries building shapes from here

    // Copies the basemap's building shapes whose centre falls inside the selected cell
    // into the highlight layer. Re-run on "idle" so it follows zooming and panning.
    function highlightBuildings() {
      const target = map.getSource("selected-buildings");
      if (!target) return;
      const layer = map.getStyle().layers.find(isBuilding);
      if (selected === null || !layer || map.getZoom() < BUILDINGS_MINZOOM) {
        target.setData(EMPTY);
        return;
      }
      const c = data.columns, size = data.cell;
      const x0 = c.e[selected] * size, y0 = c.n[selected] * size;
      const seen = new Set();
      const features = [];
      for (const f of map.querySourceFeatures(layer.source, { sourceLayer: layer["source-layer"] })) {
        const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates]
          : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
        for (const rings of polys) {
          const outer = rings[0];
          let lon = 0, lat = 0;
          for (const [x, y] of outer) { lon += x; lat += y; }
          const [x, y] = toLonLat.inverse([lon / outer.length, lat / outer.length]);
          if (x < x0 || x >= x0 + size || y < y0 || y >= y0 + size) continue;
          // Tiles overlap at their edges, so the same shape can come back twice.
          const key = outer.slice(0, 3).flat().map((v) => v.toFixed(6)).join();
          if (seen.has(key)) continue;
          seen.add(key);
          features.push({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: rings } });
        }
      }
      target.setData({ type: "FeatureCollection", features });
    }

    // Rail lines (metro, trains), stations and the selected station's walking area. Lines
    // sharing track are drawn side by side: each track piece carries its slot `k` across the
    // bundle. Railway networks (trains) are drawn in one railway style instead, so their
    // parallel tracks read as one corridor. Lines under construction are dashed, future
    // stations grey.
    const TRACK_LAYERS = ["transit-casing", "transit-lines", "transit-rail", "transit-ties", "transit-planned"];
    const STATION_LAYERS = ["station-links-casing", "station-links", "stations"];
    const PLANNED = ["boolean", ["get", "planned"], false];
    const RAIL = ["boolean", ["get", "rail"], false];
    const shown = new Set(); // keys of the networks switched on

    // Track pieces of the networks switched on; stations served by any of them.
    const trackFilter = (...more) => ["all", ["in", ["get", "net"], ["literal", [...shown]]], ...more];
    const stationFilter = () => ["any", ...[...shown].map((k) => ["boolean", ["get", `on_${k}`], false])];
    function applyNetworkFilters() {
      if (!map.getSource("transit")) return;
      map.setFilter("transit-casing", trackFilter());
      map.setFilter("transit-lines", trackFilter(["!", PLANNED], ["!", RAIL]));
      map.setFilter("transit-rail", trackFilter(RAIL));
      map.setFilter("transit-ties", trackFilter(RAIL));
      map.setFilter("transit-planned", trackFilter(PLANNED));
      for (const id of STATION_LAYERS) map.setFilter(id, stationFilter());
      map.setFilter("station-labels", ["all", stationFilter(), ["boolean", ["get", "label"], false]]);
    }
    const byZoom = (z9, z13, z16) => ["interpolate", ["linear"], ["zoom"], 9, z9, 13, z13, 16, z16];
    const LINE_W = [2, 3, 5];

    function addTransitLayers() {
      if (!transit || !styleReady || map.getSource("transit")) return;
      const css = getComputedStyle(document.documentElement);
      const surface = css.getPropertyValue("--surface").trim();
      const ink = css.getPropertyValue("--ink").trim();
      const muted = css.getPropertyValue("--muted").trim();
      const layers = map.getStyle().layers;
      const labelsStart = layers[layers.findLastIndex((l) => l.type !== "symbol") + 1]?.id;

      // Driving area (train stations): faded less than beyond it, with a dashed outline.
      map.addSource("drive", { type: "geojson", data: EMPTY });
      map.addLayer({ id: "drive-mask", type: "fill", source: "drive", filter: ["==", ["get", "part"], "mask"],
        paint: { "fill-color": surface, "fill-opacity": DRIVE_FADE } }, labelsStart);
      map.addLayer({ id: "drive-line", type: "line", source: "drive", filter: ["==", ["get", "part"], "area"],
        paint: { "line-color": ink, "line-width": 1.5, "line-dasharray": [3, 2] } }, labelsStart);
      // Walking area: everything outside it is faded, and it gets an outline.
      map.addSource("walk", { type: "geojson", data: EMPTY });
      map.addLayer({ id: "walk-mask", type: "fill", source: "walk", filter: ["==", ["get", "part"], "mask"],
        paint: { "fill-color": surface, "fill-opacity": WALK_FADE } }, labelsStart);
      map.addLayer({ id: "walk-line", type: "line", source: "walk", filter: ["==", ["get", "part"], "area"],
        paint: { "line-color": ink, "line-width": 2 } }, labelsStart);

      map.addSource("transit", { type: "geojson", data: transit.tracks });
      const offset = byZoom(...LINE_W.map((w) => ["*", ["get", "k"], w]));
      const round = { "line-cap": "round", "line-join": "round" };
      map.addLayer({ id: "transit-casing", type: "line", source: "transit", layout: round,
        paint: { "line-color": surface, "line-width": byZoom(...LINE_W.map((w) => w + 2)), "line-offset": offset } }, labelsStart);
      map.addLayer({ id: "transit-lines", type: "line", source: "transit", layout: round,
        paint: { "line-color": ["get", "c"], "line-width": byZoom(...LINE_W), "line-offset": offset } }, labelsStart);
      map.addLayer({ id: "transit-rail", type: "line", source: "transit", layout: round,
        paint: { "line-color": ink, "line-width": byZoom(...LINE_W) } }, labelsStart);
      map.addLayer({ id: "transit-ties", type: "line", source: "transit", layout: { "line-join": "round" },
        paint: { "line-color": surface, "line-width": byZoom(0.6, 1.2, 2.2), "line-dasharray": [3, 3] } }, labelsStart);
      map.addLayer({ id: "transit-planned", type: "line", source: "transit", layout: { ...round, "line-cap": "butt" },
        paint: { "line-color": ["get", "c"], "line-width": byZoom(...LINE_W), "line-dasharray": [2, 1.2] } }, labelsStart);

      // An interchange whose stations stand apart (metro and train platforms, a future
      // line's station) gets a marker at each, joined by a capsule-shaped connector, the
      // usual transit-map sign that they are one station. All its pieces share its id.
      const nets = (s) => Object.fromEntries(s.nets.map((k) => [`on_${k}`, true]));
      map.addSource("stations", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: transit.stations.flatMap((s, i) =>
            (s.parts ?? [[s.lon, s.lat, s.lines.length ? 0 : 1]]).map(([lon, lat, future], j) => ({
              type: "Feature", id: i,
              properties: { name: s.name, hub: s.lines.length + s.planned.length > 1, future: Boolean(future), label: j === 0, ...nets(s) },
              geometry: { type: "Point", coordinates: [lon, lat] },
            }))),
        },
      });
      map.addSource("station-links", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: transit.stations.flatMap((s, i) => s.parts ? [{
            type: "Feature", id: i, properties: nets(s),
            geometry: { type: "MultiLineString", coordinates: s.parts.slice(1).map((p) => [s.parts[0].slice(0, 2), p.slice(0, 2)]) },
          }] : []),
        },
      });
      const on = ["boolean", ["feature-state", "selected"], false];
      const HUB_R = [2.2, 6, 9];
      const STROKE = [0.8, 1.8, 2.5];
      map.addLayer({ id: "station-links-casing", type: "line", source: "station-links", layout: { "line-cap": "round" },
        paint: { "line-color": ink, "line-width": byZoom(...HUB_R.map((r, k) => 2 * (r + STROKE[k]))) } }, labelsStart);
      map.addLayer({ id: "station-links", type: "line", source: "station-links", layout: { "line-cap": "round" },
        paint: { "line-color": ["case", on, ink, surface], "line-width": byZoom(...HUB_R.map((r) => 2 * r)) } }, labelsStart);
      map.addLayer({ id: "stations", type: "circle", source: "stations",
        paint: {
          "circle-radius": byZoom(...HUB_R.map((r, k) => ["case", ["get", "hub"], r, [1.5, 4.5, 7][k]])),
          "circle-color": ["case", on, ink, surface],
          "circle-stroke-color": ["case", ["get", "future"], muted, ink],
          "circle-stroke-width": byZoom(...STROKE),
        } }, labelsStart);
      map.addLayer({ id: "station-labels", type: "symbol", source: "stations", minzoom: 13,
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Montserrat Medium", "Open Sans Regular", "Noto Sans Regular"],
          "text-size": 12,
          "text-anchor": "left",
          "text-offset": [0.9, 0],
          "text-optional": true,
        },
        paint: { "text-color": ["case", ["get", "future"], muted, ink], "text-halo-color": surface, "text-halo-width": 1.5 } });
      applyNetworkFilters();
      if (station !== null) showWalk(station);
    }

    function markStation(i, selected) {
      for (const source of ["stations", "station-links"]) map.setFeatureState({ source, id: i }, { selected });
    }

    // Mask = the world with the area cut out. Ring winding tells MapLibre which rings
    // are holes: the area's outer rings are reversed to become holes, and its own holes
    // are reversed to become islands of mask.
    function masked(area) {
      const world = [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]];
      const rev = (ring) => ring.slice().reverse();
      const mask = [[world, ...area.map((p) => rev(p[0]))], ...area.flatMap((p) => p.slice(1).map((h) => [rev(h)]))];
      return {
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { part: "mask" }, geometry: { type: "MultiPolygon", coordinates: mask } },
          { type: "Feature", properties: { part: "area" }, geometry: { type: "MultiPolygon", coordinates: area } },
        ],
      };
    }
    const driveOf = (i) => (transit.stations[i].drive && drives?.[transit.stations[i].name]) || null;

    // The walking area, and for a train station its driving area: the two fades stack, so
    // beyond the drive is as faded as beyond a walk alone.
    function showWalk(i) {
      markStation(i, true);
      const drive = driveOf(i);
      map.getSource("walk").setData(masked(transit.stations[i].walk));
      map.getSource("drive").setData(drive ? masked(drive) : EMPTY);
      map.setPaintProperty("walk-mask", "fill-opacity", drive ? DRIVE_FADE : WALK_FADE);
    }

    // Badge text: dark on light line colours (Line D yellow), white otherwise.
    function badge(ref) {
      // Service variants in timetables (Bx, the B express) take their line's colour.
      const exact = transit.lines.find((l) => l.ref === ref);
      const line = exact ?? transit.lines.find((l) => ref.startsWith(l.ref));
      const text = exact ? line.label : ref;
      if (line.planned) return `<span class="badge planned" style="border-color:${line.colour}">${text}</span>`;
      const [r, g, b] = [1, 3, 5].map((k) => parseInt(line.colour.slice(k, k + 2), 16) / 255);
      const light = 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55;
      return `<span class="badge" style="background:${line.colour};color:${light ? "#1a1a19" : "#ffffff"}">${text}</span>`;
    }
    const lineOf = (ref) => transit.lines.find((l) => l.ref === ref);
    // OSM networks behind a toggle's lines: a line drawn with another network's (the Vouga
    // line, a CP Regional service, with CP Porto) carries its own.
    const networkNames = (n, refs) => [...new Set(refs.map(lineOf).filter((l) => l.net === n.key).map((l) => l.network ?? n.network))];

    // Minutes between trains in each direction, per line and for all lines together,
    // from the trains per hour counted in the timetable.
    function trainsBlock(s) {
      const net = transit.networks.find((n) => n.timetable);
      const tt = net?.timetable;
      const without = transit.networks.filter((n) => !n.timetable && s.lines.some((r) => lineOf(r).net === n.key));
      const missing = without.length ? `<p class="note">${t("noTimetable", without.flatMap((n) => networkNames(n, s.lines)).join(", "))}</p>` : "";
      if (!tt || !s.freq?.all) return without.length && s.lines.length ? `<h2>${t("frequency")}</h2>${missing}` : "";
      const wait = (tph) => {
        if (!(tph > 0)) return "–";
        const m = 60 / tph;
        return m < 5 ? fmt1.format(m) : fmtInt.format(m);
      };
      const period = (p) => t("periods")[p.label] ?? p.label;
      const head = tt.periods.map((p) => `<th title="${t("days")[p.day]} ${t("hours", p.hours)}">${period(p)}</th>`).join("");
      const refs = Object.keys(s.freq).filter((r) => r !== "all").sort();
      const row = (label, values, cls = "") => `<tr class="${cls}"><th>${label}</th>${values.map((v) => `<td>${wait(v)}</td>`).join("")}</tr>`;
      const weekday = tt.periods.filter((p) => p.day === "monday").map((p) => `${period(p).toLowerCase()} ${t("hours", p.hours)}`).join(", ");
      const weekend = [...new Set(tt.periods.filter((p) => p.day !== "monday").map((p) => t("hours", p.hours)))].join(", ");
      const date = (d) => new Date(d).toLocaleDateString(t("locale"), { day: "numeric", month: t("dateMonth"), year: "numeric" });
      return `
        <h2>${t("frequency")}</h2>
        <p class="trains-total">${t("trainsTotal", fmtInt.format(s.freq.all[0]), net, s.nets.length > 1)}</p>
        <table class="freq">
          <thead><tr><th></th>${head}</tr></thead>
          <tbody>
            ${refs.map((r) => row(badge(r), s.freq[r])).join("")}
            ${refs.length > 1 ? row(t("all"), s.freq.all.map((v) => v / 2), "all") : ""}
          </tbody>
        </table>
        <p class="note">${t("freqNote", weekday, weekend, net.network, date(tt.from), date(tt.to))}</p>${missing}`;
    }

    function showStation(i) {
      const s = transit.stations[i];
      const w = transit.walk;
      const item = (ref) => {
        const line = lineOf(ref);
        const label = line.planned ? t("planned", line, line.opening) : line.ends;
        return `<li>${badge(ref)} <span>${label}</span></li>`;
      };
      // Lines grouped by network: "Metro", "Trains (CP Porto)".
      const lines = transit.networks.map((n) => {
        const refs = [...s.lines, ...s.planned].filter((r) => lineOf(r).net === n.key);
        if (!refs.length) return "";
        const names = networkNames(n, refs).join(", ");
        const title = names.includes(n.label) ? netLabel(n) : `${netLabel(n)} (${names})`;
        return `<h2>${title}</h2><ul class="line-list">${refs.map(item).join("")}</ul>`;
      }).join("");
      const future = s.lines.length === 0;
      document.getElementById("panel-body").innerHTML = `
        <div class="station-name">${s.name}</div>
        ${future ? `<p class="note" style="margin:-4px 0 8px">${t("future")}${s.approx ? t("approx") : ""}</p>` : ""}
        <div class="hero">${fmtInt.format(s.pop)} <small>${t("walkHero", w.minutes)}</small></div>
        <dl class="rows">
          <dt>${t("walkArea")}</dt><dd>${fmt1.format(s.km2)} km²</dd>
          <dt>${t("densityThere")}</dt><dd>${s.km2 > 0 ? fmtInt.format(s.pop / s.km2) : "–"} / km²</dd>
        </dl>
        <p class="note">${t("walkNote", w.minutes, fmt1.format(w.kmh), fmtInt.format(w.metres))}</p>
        ${driveBlock(s)}
        ${lines}
        ${trainsBlock(s)}
      `;
      openPanel();
    }

    function driveBlock(s) {
      if (!s.drive) return "";
      const d = s.drive;
      return `
        <h2>${t("byCar")}</h2>
        <div class="hero">${fmtInt.format(d.pop)} <small>${t("driveHero", d.minutes)}</small></div>
        <dl class="rows"><dt>${t("driveArea")}</dt><dd>${fmtInt.format(d.km2)} km²</dd></dl>
        <p class="note">${t("driveNote", d.minutes, fmtInt.format(100 * transit.drive.maxspeed_share),
          transit.drive.signal_s, transit.drive.junction_s, fmtInt.format(transit.drive.reach_m))}</p>`;
    }

    function selectStation(i) {
      if (station !== null && map.getSource("stations")) markStation(station, false);
      station = i;
      if (i === null) {
        map.getSource("walk")?.setData(EMPTY);
        map.getSource("drive")?.setData(EMPTY);
        return;
      }
      select(null);
      showWalk(i);
      showStation(i);
      const [w, s, e, n] = (driveOf(i) ?? transit.stations[i].walk).flat(2).reduce(
        ([w, s, e, n], [x, y]) => [Math.min(w, x), Math.min(s, y), Math.max(e, x), Math.max(n, y)],
        [Infinity, Infinity, -Infinity, -Infinity]);
      const free = clearArea();
      map.fitBounds([[w, s], [e, n]], {
        padding: narrowQuery.matches
          ? { top: free.top + 10, bottom: innerHeight - free.bottom + 10, left: 20, right: 20 }
          : { top: 40, bottom: 40, left: 340, right: 380 },
        maxZoom: 15,
      });
    }

    function floorsBlock(c, i) {
      const n = c.apt_floors_n[i];
      if (!n) {
        return `<p class="note">${t("floorsNone")}</p>`;
      }
      return `<div class="floors">${t("floorsValue", fmt1.format(c.apt_floors[i]))}</div>
        <p class="note" style="margin-top:2px">${t("floorsFrom", n)}</p>`;
    }

    function buildingHint() {
      return map.getZoom() < BUILDINGS_MINZOOM ? t("zoomHint") : t("highlighted");
    }

    function showCell(i) {
      const c = data.columns;
      const density = c.pop[i] / cellKm2();
      const [lon, lat] = toLonLat.forward([(c.e[i] + 0.5) * data.cell, (c.n[i] + 0.5) * data.cell]);
      const view = `${lat.toFixed(5)}/${lon.toFixed(5)}`;
      const err = data.errors || {};

      document.getElementById("panel-body").innerHTML = `
        <div class="hero">${fmtInt.format(density)} <small>${t("perKm2")}</small></div>
        <dl class="rows">
          <dt>${t("residents")}</dt><dd>${fmtInt.format(c.pop[i])}</dd>
          <dt>${t("dwellings")}</dt><dd>${fmtInt.format(c.dwellings[i])}</dd>
          <dt>${t("households")}</dt><dd>${fmtInt.format(c.households[i])}</dd>
          <dt>${t("hhSize")}</dt><dd>${c.households[i] > 0 ? fmt1.format(c.pop[i] / c.households[i]) : "–"}</dd>
          <dt>${t("cellSize")}</dt><dd>${data.cell} m × ${data.cell} m</dd>
        </dl>
        <p class="note">
          ${t("cellNote")}
          ${err.pop ? t("cellError", errText(err.pop), err.hh_size && errText(err.hh_size)) : ""}
        </p>

        <h2>${t("resBuildings")}</h2>
        <dl class="rows">
          <dt>${t("withDwellings")}</dt><dd>${count(c.res_bldg[i])}</dd>
        </dl>
        ${splitBar([t("singleFamily"), c.houses[i], "--houses"], [t("apartments"), c.apt_bldg[i], "--apts"])}
        <p class="note">
          ${t("typeNote")}
          ${err.res_bldg ? t("typeError", errText(err.res_bldg), errText(err.apt_share)) : ""}
        </p>

        <h2>${t("floors")}</h2>
        ${splitBar([t("lowRise"), c.low_rise[i], "--low"], [t("midRise"), c.mid_rise[i], "--tall"])}
        <p class="note">${t("floorsNote")}${err.rise_share ? t("floorsError", errText(err.rise_share)) : ""}</p>
        ${floorsBlock(c, i)}
        <p class="note" id="building-hint">${buildingHint()}</p>
        <p class="note">
          ${t("cell")} ${c.e[i]}E ${c.n[i]}N (EPSG:3035) ·
          <a href="https://www.openstreetmap.org/?mlat=${lat.toFixed(5)}&mlon=${lon.toFixed(5)}#map=15/${view}" target="_blank" rel="noopener">OSM</a> ·
          <a href="https://www.google.com/maps/@${lat.toFixed(5)},${lon.toFixed(5)},700m/data=!3m1!1e3" target="_blank" rel="noopener">${t("satellite")}</a>
        </p>
      `;
      openPanel();
    }

    // Each new selection opens the panel at the top; on phones as a collapsed sheet.
    const panel = document.getElementById("panel");
    function openPanel() {
      panel.hidden = false;
      expandPanel(false);
      foldTitle(true);
    }
    function closePanel() {
      panel.hidden = true;
      foldTitle(titleFolded);
    }
    // Phones: the title card folds while something is selected, and otherwise as the
    // viewer last left it with its fold button.
    let titleFolded = false;
    function foldTitle(folded) {
      document.getElementById("title").classList.toggle("folded", folded);
      const button = document.getElementById("fold");
      button.setAttribute("aria-expanded", !folded);
      button.setAttribute("aria-label", folded ? t("showMore") : t("showLess"));
    }
    document.getElementById("fold").addEventListener("click", () => {
      titleFolded = !document.getElementById("title").classList.contains("folded");
      foldTitle(titleFolded);
    });
    function expandPanel(open) {
      panel.classList.toggle("expanded", open);
      document.getElementById("grip").setAttribute("aria-expanded", open);
      if (!open) document.getElementById("panel-body").scrollTop = 0;
    }

    // The part of the screen (in pixels from the top) not covered by the title card and
    // the panel. On wide screens both sit at the sides, so it is the whole height.
    function clearArea() {
      if (!narrowQuery.matches) return { top: 0, bottom: innerHeight };
      const top = document.getElementById("title").getBoundingClientRect().bottom;
      return { top, bottom: panel.hidden ? innerHeight : panel.getBoundingClientRect().top };
    }

    function select(i) {
      if (selected !== null) map.setFeatureState({ source: "cells", id: selected }, { selected: false });
      selected = i;
      if (i === null) {
        closePanel();
        highlightBuildings();
        return;
      }
      selectStation(null);
      map.setFeatureState({ source: "cells", id: i }, { selected: true });
      showCell(i);
      highlightBuildings();
      // On phones, slide the cell out from under the title card or the sheet.
      const c = data.columns;
      const centre = toLonLat.forward([(c.e[i] + 0.5) * data.cell, (c.n[i] + 0.5) * data.cell]);
      const { y } = map.project(centre);
      const free = clearArea();
      const margin = Math.min(40, (free.bottom - free.top) / 4);
      if (y < free.top + margin || y > free.bottom - margin) map.panBy([0, y - (free.top + free.bottom) / 2]);
    }

    let hovered = null;
    map.on("mousemove", "cells-fill", (ev) => {
      const id = ev.features[0].id;
      if (hovered === id) return;
      if (hovered !== null) map.setFeatureState({ source: "cells", id: hovered }, { hover: false });
      hovered = id;
      map.setFeatureState({ source: "cells", id }, { hover: true });
      map.getCanvas().style.cursor = "pointer";
    });
    map.on("mouseleave", "cells-fill", () => {
      if (hovered !== null) map.setFeatureState({ source: "cells", id: hovered }, { hover: false });
      hovered = null;
      map.getCanvas().style.cursor = "";
    });
    // Stations get a hit area wider than their dot, and win over the cell underneath.
    const near = (p, r) => [[p.x - r, p.y - r], [p.x + r, p.y + r]];
    const stationAt = (p) => map.getLayer("stations") && map.queryRenderedFeatures(near(p, 8), { layers: ["stations"] })[0];
    const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12, className: "tip" });
    let tipFor = null;
    map.on("mousemove", (ev) => {
      const hit = stationAt(ev.point);
      if (!hit) {
        if (tipFor !== null) {
          tip.remove();
          map.getCanvas().style.cursor = hovered !== null ? "pointer" : "";
        }
        tipFor = null;
        return;
      }
      map.getCanvas().style.cursor = "pointer";
      if (tipFor === hit.id) return;
      tipFor = hit.id;
      const s = transit.stations[hit.id];
      const labels = (refs) => refs.map((r) => lineOf(r).label).join(" ");
      const soon = s.planned.length ? `${s.lines.length ? " + " : ""}${labels(s.planned)} ${t("underConstruction")}` : "";
      tip.setLngLat([s.lon, s.lat]).setHTML(`<b>${s.name}</b> · ${labels(s.lines)}${soon}`).addTo(map);
    });
    map.on("click", (ev) => {
      const st = stationAt(ev.point);
      if (st) return selectStation(st.id);
      const hit = map.queryRenderedFeatures(ev.point, { layers: ["cells-fill"] })[0];
      if (hit) return select(hit.id);
      select(null);
      selectStation(null);
    });
    const clearAll = () => { select(null); selectStation(null); };
    document.getElementById("close").addEventListener("click", clearAll);
    // Bottom sheet (phones): the grip toggles it, a tap on the peek expands it, and a swipe
    // up expands it while a swipe down collapses it (once scrolled to the top) or closes it.
    document.getElementById("grip").addEventListener("click", (ev) => {
      ev.stopPropagation();
      expandPanel(!panel.classList.contains("expanded"));
    });
    panel.addEventListener("click", (ev) => {
      if (!narrowQuery.matches || panel.classList.contains("expanded") || ev.target.closest("a, button")) return;
      expandPanel(true);
    });
    // A swipe that scrolled the details back to the top is a scroll, so the scroll
    // position is taken from the swipe's start.
    let swipe = null;
    panel.addEventListener("touchstart", (ev) => {
      swipe = { y: ev.touches[0].clientY, atTop: document.getElementById("panel-body").scrollTop <= 0 };
    }, { passive: true });
    panel.addEventListener("touchend", (ev) => {
      if (swipe === null || !narrowQuery.matches) return;
      const dy = ev.changedTouches[0].clientY - swipe.y;
      const { atTop } = swipe;
      swipe = null;
      const expanded = panel.classList.contains("expanded");
      if (dy < -30 && !expanded) expandPanel(true);
      else if (dy > 30 && expanded && atTop) expandPanel(false);
      else if (dy > 30 && !expanded) clearAll();
    });
    document.addEventListener("keydown", (ev) => ev.key === "Escape" && clearAll());
    document.getElementById("transit-toggles").addEventListener("change", (ev) => {
      const key = ev.target.dataset.net;
      if (ev.target.checked) shown.add(key);
      else shown.delete(key);
      applyNetworkFilters();
      if (station !== null && !transit.stations[station].nets.some((k) => shown.has(k))) clearAll();
    });

    // Switching theme swaps the basemap style, which drops our layers: re-add them.
    darkQuery.addEventListener("change", () => {
      styleReady = false;
      map.setStyle(BASEMAP[theme()], { diff: false }); // diffing would skip "style.load"
    });
    // Updating the highlight re-renders and fires "idle" again, so only redo it when
    // the selection or the view actually changed.
    let highlightedView = "";
    map.on("idle", () => {
      if (selected === null) return;
      const view = `${selected}|${map.getZoom().toFixed(2)}|${map.getCenter().toArray()}`;
      if (view === highlightedView) return;
      highlightedView = view;
      highlightBuildings();
      const hint = document.getElementById("building-hint");
      if (hint) hint.textContent = buildingHint();
    });
    map.on("style.load", () => {
      styleReady = true;
      highlightedView = ""; // a new basemap means new building tiles: redo the highlight
      addLayers();
      addTransitLayers();
    });

    function loadScript(src, global) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => (window[global] ? resolve(window[global]) : reject(new Error("empty data file")));
        script.onerror = () => reject(new Error("file not found"));
        document.head.appendChild(script);
      });
    }
    const loadData = () => loadScript(`data/${REGION}.js`, "GRID_DATA");

    // One toggle per rail network, with the share of residents near its stations.
    function renderToggles() {
      const pct = (v) => Math.round((100 * v) / transit.total_pop);
      const minutes = transit.walk.minutes;
      const rows = transit.networks.map((n) => {
        const building = transit.lines.filter((l) => l.net === n.key && l.planned).map((l) => t("plannedName", l));
        const extra = transit.lines.filter((l) => l.net === n.key && l.network).map((l) => `${l.network} (${l.label})`);
        const text = t("toggle", [n.network, ...extra].join(", "), n.stations, pct(n.covered_pop), minutes) +
          (building.length && n.covered_pop_planned ? t("togglePlanned", pct(n.covered_pop_planned), building) : "") +
          (n.drive_minutes ? t("toggleDrive", pct(n.drive_covered_pop), n.drive_minutes) : "");
        const style = transit.tracks.features.some((f) => f.properties.net === n.key && f.properties.rail) ? "rail" : "colours";
        return `<label><input type="checkbox" data-net="${n.key}" ${shown.has(n.key) ? "checked" : ""}>
          <i class="swatch ${style}"></i><span>${text}</span></label>`;
      });
      if (transit.networks.length > 1) rows.push(`<p>${t("anyStation", pct(transit.covered_pop), minutes)}</p>`);
      document.getElementById("transit-toggles").innerHTML = rows.join("");
    }

    // The rail layer is optional: regions without data/<region>_transit.js just skip it.
    loadScript(`data/${REGION}_transit.js`, "TRANSIT_DATA")
      .then((json) => {
        transit = json;
        for (const n of transit.networks) shown.add(n.key);
        renderToggles();
        addTransitLayers();
        // Driving areas are big: load them once the map is up, and show the open station's.
        if (transit.networks.some((n) => n.drive_minutes)) {
          loadScript(`data/${REGION}_drive.js`, "DRIVE_DATA").then((json) => {
            drives = json;
            if (station !== null && map.getSource("drive")) selectStation(station);
          }).catch(() => {});
        }
      })
      .catch(() => {});

    // Text that depends on the grid: its name, cell size and totals, or the load error.
    let loadError = null;
    function renderGridText() {
      const title = document.getElementById("region"), subtitle = document.getElementById("subtitle");
      const status = document.getElementById("status");
      if (loadError) {
        status.textContent = t("loadError", `data/${REGION}.js`, loadError);
      } else if (!data) {
        status.textContent = t("loading");
      } else {
        title.textContent = data.region;
        subtitle.textContent = t("subtitle", data.cell);
        const total = data.columns.pop.reduce((a, b) => a + b, 0);
        status.textContent = t("status", fmtInt.format(total), fmtInt.format(data.count));
        return;
      }
      title.textContent = t("heading");
      subtitle.textContent = t("subtitleShort");
    }

    // Switching language re-renders all text in place, keeping the selection and view.
    function applyLang() {
      document.documentElement.lang = t("locale").startsWith("pt") ? "pt-PT" : "en";
      document.title = t("title");
      setFormats();
      document.getElementById("coffee-text").textContent = t("coffee");
      document.getElementById("credits").innerHTML = t("credits");
      document.getElementById("lang").setAttribute("aria-label", t("language"));
      for (const b of document.querySelectorAll("#lang button")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
      document.getElementById("grip").setAttribute("aria-label", t("showMoreDetails"));
      document.getElementById("close").setAttribute("aria-label", t("close"));
      foldTitle(document.getElementById("title").classList.contains("folded"));
      renderLegend();
      renderGridText();
      if (transit) renderToggles();
      if (panel.hidden) return;
      const expanded = panel.classList.contains("expanded"), scroll = document.getElementById("panel-body").scrollTop;
      if (selected !== null) showCell(selected);
      else if (station !== null) showStation(station);
      expandPanel(expanded);
      document.getElementById("panel-body").scrollTop = scroll;
    }
    document.getElementById("lang").addEventListener("click", (ev) => {
      const next = ev.target.closest("button")?.dataset.lang;
      if (!next || next === lang) return;
      lang = next;
      try { localStorage.setItem("lang", lang); } catch {}
      applyLang();
    });

    applyLang();
    loadData()
      .then((json) => {
        data = json;
        renderGridText();
        if (!startedWithView) map.fitBounds([data.bounds.slice(0, 2), data.bounds.slice(2)], { padding: 20, duration: 0 });
        if (styleReady) addLayers();
      })
      .catch((err) => {
        loadError = err.message;
        renderGridText();
      });
  </script>
</body>
</html>
